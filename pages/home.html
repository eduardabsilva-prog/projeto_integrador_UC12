

<!DOCTYPE html>
<html lang="pt-BR">

<head>

    
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CompraFácil | Início</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/home.css">

</head>

<body>

    <!-- 
         CABEÇALHO DA INICIO -->

    <header class="home-header">

        <!-- Logo -->
        <a href="home.html" class="home-logo">
            Compra<span>Fácil</span>
        </a>

        <!-- Barra de pesquisa -->
        <div class="home-search">

            <input
                type="search"
                id="pesquisa-produtos"
                placeholder="O que você procura hoje?"
            >

            <button type="button" aria-label="Pesquisar">
                🔍
            </button>

        </div>

        <!-- Acesso ao perfil -->
        <button class="home-profile" type="button">
            👤
            <span>Minha conta</span>
        </button>

    </header>


    <!-- ======================================
         CONTEÚDO PRINCIPAL
    ======================================= -->

    <main class="home-main">

        <!-- Boas-vindas -->
        <section class="home-welcome">

            <h1>Olá, seja bem-vindo! 🛒</h1>

            <p>
                Encontre ofertas, economize e facilite suas compras.
            </p>

        </section>


        <!-- Banner principal -->
        <section class="home-banner">

            <!-- O banner será desenvolvido na próxima etapa -->

        </section>


        <!-- Categorias -->
        <section class="home-categories">

            <div class="section-heading">

                <h2>Explore por categorias</h2>

                <p>Encontre o que você precisa</p>

            </div>

            <!-- Categorias serão adicionadas depois -->

        </section>


        <!-- Ofertas -->
        <section class="home-offers">

            <div class="section-heading">

                <h2>Ofertas para você</h2>

                <p>Confira nossos produtos em destaque</p>

            </div>

            <!-- Produtos serão adicionados depois -->

        </section>


    </main>


    <!-- 
         NAVEGAÇÃO INFERIOR -->

    <nav class="home-navigation">

        <a href="home.html" class="nav-item active">
            🏠
            <span>Início</span>
        </a>

        <a href="#" class="nav-item">
            🏷️
            <span>Ofertas</span>
        </a>

        <a href="#" class="nav-item">
            🛒
            <span>Compras</span>
        </a>

        <a href="#" class="nav-item">
            👤
            <span>Perfil</span>
        </a>

    </nav>


</body>

</html>
